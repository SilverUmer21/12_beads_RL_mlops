name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install CPU-only PyTorch
        run: pip install torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu

      - name: Install the package
        run: pip install -e ".[dev,rl]"

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest

  puzzle-gate:
    # Pulls the champion model + puzzle suite from the DVC remote and fails if
    # puzzle accuracy drops. Fork PRs get no secrets, so they skip this job.
    needs: test
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install CPU-only PyTorch
        run: pip install torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu

      - name: Install the package
        run: pip install -e ".[rl]"

      - name: Check AWS credentials
        run: |
          if [ -z "$AWS_ACCESS_KEY_ID" ] || [ -z "$AWS_SECRET_ACCESS_KEY" ]; then
            echo "::error::Add AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY as repository secrets so CI can dvc pull."
            exit 1
          fi

      - name: Pull the champion and the puzzles
        run: dvc pull models/policy.onnx data/puzzles.jsonl

      - name: Choose the baseline
        # PRs: the base branch's recorded accuracy. Pushes: the accuracy recorded in this commit.
        run: |
          if [ -n "${{ github.base_ref }}" ] && git show "origin/${{ github.base_ref }}:reports/eval.json" > baseline.json 2>/dev/null; then
            echo "Baseline: origin/${{ github.base_ref }}"
          else
            cp reports/eval.json baseline.json
            echo "Baseline: reports/eval.json at ${{ github.sha }}"
          fi

      - name: Puzzle gate
        run: python -m barahai.rl.gate --baseline baseline.json
