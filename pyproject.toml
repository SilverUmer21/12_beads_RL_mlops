[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "barahai"
version = "0.2.0"
description = "Barah Goti (12 Beads): rules engine, bots, an RL agent and an MLOps pipeline"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = []

[project.optional-dependencies]
game = ["pygame-ce>=2.5", "numpy>=1.26"]
dev = ["pytest>=8", "ruff>=0.17"]
rl = [
    "numpy>=1.26",
    "pyyaml>=6",
    "gymnasium==1.4.0",
    "sb3-contrib==2.9.0",
    "torch==2.14.1",
    "mlflow==3.17.2",
    "dvc[s3]==3.67.1",
    "onnx==1.23.2",
    "onnxruntime==1.29.0",
]
serve = ["flask==3.1.3", "onnxruntime==1.29.0", "numpy>=1.26", "gunicorn"]

[project.scripts]
barahai = "barahai.game.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
