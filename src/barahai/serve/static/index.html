<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BarahAI · Barah Goti</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header>
  <h1>Barah Goti <span>· play the BarahAI model</span></h1>
  <nav><a href="/docs">API docs</a> · <a href="https://github.com/SilverUmer21/12_beads_RL_mlops">GitHub</a></nav>
</header>
<main>
  <section class="board-wrap">
    <div class="evalbar" title="Model's evaluation: carnelian (bottom) vs turquoise (top)">
      <div id="eval-fill"></div>
    </div>
    <svg id="board" viewBox="-60 -60 520 520" aria-label="Game board"></svg>
  </section>
  <aside>
    <div class="panel">
      <label>You play
        <select id="colour"><option value="carnelian">Carnelian (moves first)</option><option value="turquoise">Turquoise</option></select>
      </label>
      <label>Model
        <select id="mode"><option value="search">With search (stronger)</option><option value="policy">Network only (faster)</option></select>
      </label>
      <button id="new">New game</button>
    </div>
    <div class="panel" id="status">Loading…</div>
    <div class="panel small" id="info"></div>
    <div class="panel"><h2>Moves</h2><ol id="history"></ol></div>
  </aside>
</main>
<footer>Click one of your beads, then a highlighted point. Captures are mandatory and a jumping bead keeps jumping while it can.</footer>
<script src="/static/app.js"></script>
</body>
</html>
