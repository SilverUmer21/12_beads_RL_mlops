# BarahAI service stack.
#
#   docker compose up -d                          api + caddy (the web app and API)
#   docker compose --profile monitoring up -d     also Prometheus and Grafana
#
# Settings come from .env (see deploy/.env.example). On the server, the deploy
# pipeline writes .env with the image tag and the public site address.

name: barahai

services:
  api:
    image: ${API_IMAGE:-barahai-api:local}
    build:
      context: .
      args:
        MODEL_VERSION: ${MODEL_VERSION:-local}
        GIT_SHA: ${GIT_SHA:-local}
    restart: unless-stopped
    expose:
      - "8000"
    volumes:
      - games-data:/data
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ["CMD", "python", "-c", "import sys, urllib.request; sys.exit(urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=2).status != 200)"]
      interval: 15s
      timeout: 3s
      start_period: 15s
      retries: 3

  caddy:
    image: caddy:2.11-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      api:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 128M

  prometheus:
    image: prom/prometheus:v3.16.0
    profiles: [monitoring]
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      api:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 384M

  grafana:
    image: grafana/grafana:13.3.1
    profiles: [monitoring]
    restart: unless-stopped
    environment:
      GF_SERVER_ROOT_URL: "%(protocol)s://%(domain)s/grafana/"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-change-me}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    deploy:
      resources:
        limits:
          memory: 384M

volumes:
  games-data:
  caddy-data:
  caddy-config:
  prometheus-data:
  grafana-data:
